[pytest]
# Test discovery for the repo. Run the whole suite with a bare `pytest` from the root:
#   integrations/telegram-bridge/.venv/Scripts/python.exe -m pytest -q
#
# NOTE: .claude/hooks/test_guard.py is currently RED (pre-existing, unrelated to the
# git-hygiene work -- evaluate() classifies red paths such as .claude/settings.json as
# "ungoverned" and allows the write). It is listed here deliberately rather than hidden:
# a known-failing security suite should stay visible. Escalated to Rambo/owner 2026-07-26.
testpaths =
    integrations/git-hygiene
    integrations/telegram-bridge
    .claude/hooks
python_files = test_*.py
norecursedirs = .venv node_modules __pycache__ .git sources dist build
